name: tests

# Runs the pytest suite on every PR and on pushes to the two long-lived
# branches. Separate from release.yml on purpose: that one builds and publishes
# Windows artifacts on tag pushes and must stay untouched by test failures here.
on:
  pull_request:
  push:
    branches: [preview, stable]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # PySide6 links these even under the offscreen platform plugin.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      # needs_clips tests replay AEB clips from a local clip store that is not
      # in the repo, so they are deselected here rather than left to skip
      # silently. MONOCRUISE_STRICT_SKIPS turns any *other* skip into a build
      # failure: a test that skips is a test asserting nothing.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MONOCRUISE_STRICT_SKIPS: '1'
        run: pytest -q --strict-markers -m "not needs_clips"
